<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Notes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <h1 class="text-2xl font-bold mb-4">Notes App</h1>

  <!-- Simple Auth Section -->
  <div id="auth-section" class="mb-6 bg-white p-4 rounded shadow">
    <input id="email" type="email" placeholder="Email" class="border p-2 mr-2">
    <input id="password" type="password" placeholder="Password" class="border p-2 mr-2">
    <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
  </div>

  <!-- Dynamic Content Display -->
  <div id="app-content"></div>

  <script src="app.js"></script>
</body>
</html>
